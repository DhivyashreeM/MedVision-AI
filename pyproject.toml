[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvision-ai"
version = "0.1.0"
description = "Evidence-grounded multimodal medical AI decision-support platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "MedVision AI Team" }
]
keywords = [
    "medical-imaging",
    "decision-support",
    "multimodal-ai",
    "chest-xray",
    "explainable-ai",
    "gradcam",
    "evidence-grounding"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.6.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]
frontend = [
    "streamlit>=1.42.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
include = ["app", "scripts", "training", "tests", "frontend"]
exclude = ["**/node_modules", "**/__pycache__", ".git"]
extraPaths = [
    ".",
    "C:/Users/cathe/AppData/Local/Programs/Python/Python313/Lib/site-packages"
]
pythonVersion = "3.13"
pythonPlatform = "Windows"
reportMissingImports = false

